name: Lint

on:
  push:
    branches:
      - "main"
  pull_request:
    branches:
      - "main"

permissions: {}

# Ruff is a standalone binary and needs no project dependencies, so the lint
# job runs it directly via uvx and does not install the Home Assistant stack.
# Keep the ruff version aligned with the repo target (pyproject required-version).

jobs:
  ruff:
    name: "Ruff"
    runs-on: "ubuntu-latest"
    steps:
      - name: Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.5"

      - name: Check code format
        run: uvx ruff@0.13.0 format --check .

      - name: Lint with Ruff
        run: uvx ruff@0.13.0 check .
